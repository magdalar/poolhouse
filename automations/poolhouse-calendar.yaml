alias: 'Calendar-Toggle: PoolHouse Automation'
description: >-
  Create entries in the 'PoolHouse Automation' calendar to trigger input_boolean,
  light, fan, or switch toggles, or activate scenes/scripts. For scenes and
  scripts, only the start of the event matters. Prefix the summary with
  'Start:' or 'End:' to skip the on or off action for the other lifecycle
  domains. There is no logic to consider current states or bypasses; this is
  a dumb trigger.
triggers:
  - trigger: calendar
    event: start
    offset: '0:0:0'
    entity_id: calendar.poolhouse_automation
    id: start
  - trigger: calendar
    event: end
    offset: '0:0:0'
    entity_id: calendar.poolhouse_automation
    id: end
conditions: []
variables:
  location: "{{ trigger.calendar_event.location }}"
  summary: "{{ trigger.calendar_event.summary }}"
  domain: "{{ location.split('.')[0] if '.' in location else '' }}"
actions:
  - choose:
      # Bad/unknown entity referenced in location
      - conditions:
          - condition: template
            value_template: "{{ states(location) == 'unknown' }}"
        sequence:
          - action: system_log.write
            data:
              level: error
              message: >-
                Calendar entry '{{ summary }}' has unknown entity as location:
                '{{ location }}'. More details: {{ trigger.calendar_event }}

      # Scenes/scripts: fire only on start, no on/off distinction
      - conditions:
          - condition: trigger
            id: start
          - condition: template
            value_template: "{{ domain in ['scene', 'script'] }}"
        sequence:
          - action: "{{ domain }}.turn_on"
            target:
              entity_id: "{{ location }}"
            continue_on_error: true

      # Toggleable domains: on at start (unless 'End:'), off at end (unless 'Start:')
      - conditions:
          - condition: template
            value_template: "{{ domain in ['light', 'fan', 'switch', 'input_boolean'] }}"
          - condition: or
            conditions:
              - condition: and
                conditions:
                  - condition: trigger
                    id: start
                  - condition: template
                    value_template: "{{ not summary.startswith('End:') }}"
              - condition: and
                conditions:
                  - condition: trigger
                    id: end
                  - condition: template
                    value_template: "{{ not summary.startswith('Start:') }}"
        sequence:
          - action: "{{ domain }}.turn_{{ 'on' if trigger.id == 'start' else 'off' }}"
            data:
              entity_id: "{{ location }}"
            continue_on_error: true

      # Ignore 'start' events for 'End:' summaries.
      - conditions:
          - condition: trigger
            id: start
          - condition: template
            value_template: '{{ summary.startswith(''End:'') }}'
        sequence: []

      # Any other 'end' event we don't otherwise handle: ignore silently
      - conditions:
          - condition: trigger
            id: end
        sequence: []
    default:
      - action: system_log.write
        data:
          level: error
          message: "Malformatted or unsupported calendar entry. Trigger: {{ trigger }}"
mode: parallel
max: 10
